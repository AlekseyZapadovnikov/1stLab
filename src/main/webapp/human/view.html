<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HumanBeing — просмотр</title>
    <link rel="stylesheet" href="../assets/styles.css">
    <script type="module" src="../assets/view.js"></script>
</head>
<body data-base="../">
<header></header>
<main>
    <h1 id="title">Просмотр по ID</h1>
    <p class="connection" data-connection role="status">Подключаем автоматическое обновление…</p>
    <div class="notice" data-message role="alert" hidden></div>
    <form id="lookup" class="lookup"><label>ID объекта<input type="number" name="id" min="1" max="2147483647" step="1" required></label><button>Открыть</button></form>
    <section class="panel" aria-label="Данные объекта"><dl id="details" class="details"></dl>
        <div id="object-actions" class="actions" hidden><button id="edit">Изменить</button><button id="delete" class="danger">Удалить</button></div>
    </section>
</main>
</body>
</html>
